name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master
trigger:
  branches:
    include:
      - master

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    name: Default
  variables:
  - group: Azure-Static-Web-Apps-agreeable-island-0069a3b03-variable-group
  steps:
  - checkout: self
    submodules: true
  - task: DotNetCoreCLI@2
    displayName: 'Build Blazor WASM'
    inputs:
      command: 'publish'
      projects: 'mSzczepienia.Client/*.csproj' 
      arguments: '-c Release -o $(Build.ArtifactStagingDirectory)/published'
  - script: npm install -g @azure/static-web-apps-cli
    displayName: 'Install SWA CLI'
  - script: |
      swa deploy . --env production --deployment-token $(AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_ISLAND_0069A3B03)
    workingDirectory: $(Build.ArtifactStagingDirectory)\published\wwwroot
    displayName: 'Deploy to Azure Static Web Apps'