name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master
trigger:
  branches:
    include:
      - master

pool:
  vmImage: ubuntu-latest

variables:
- group: Azure-Static-Web-Apps-agreeable-island-0069a3b03-variable-group

steps:
  - checkout: self
    submodules: true
  - task: AzureStaticWebApp@0
    displayName: 'Build and Deploy Client App'
    inputs:
      app_location: 'mSzczepienia.Client'
      api_location: ''
      output_location: 'wwwroot'
      azure_static_web_apps_api_token: $(deployment_token)