name: Azure Static Web Apps CI/CD

pr:
  branches:
    include:
      - master
trigger:
  branches:
    include:
      - master

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    name: Default
  variables:
  - group: Azure-Static-Web-Apps-agreeable-island-0069a3b03-variable-group
  steps:
  - checkout: self
    submodules: true
  - task: DotNetCoreCLI@2
    displayName: 'Build Blazor WASM'
    inputs:
      command: 'publish'
      projects: 'mSzczepienia.Client/*.csproj' 
      arguments: '-c Release -o $(Build.ArtifactStagingDirectory)/published'
  - task: AzureStaticWebApp@0
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_AGREEABLE_ISLAND_0069A3B03)
      app_location: "$(Build.ArtifactStagingDirectory)/published/wwwroot"
      api_location: "" 
      output_location: ""
      skip_app_build: true
      skip_api_build: true