services:
  api:
    build:
      context: . 
      dockerfile: mSzczepienia.Api/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}
      - BlobStorage__ConnectionString=${BLOB_CONNECTION_STRING}
      - BlobStorage__ContainerName=mszczepienia-ocr
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db
    volumes:
      - ./mSzczepienia.Api/Data/Csv:/app/Data/Csv

  db:
    image: "mcr.microsoft.com/mssql/server:2022-latest"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong!Passw0rd
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data: